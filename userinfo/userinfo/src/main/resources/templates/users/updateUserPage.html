<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <title>Edit User</title>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-md-8 mx-auto rounded border p-4 m-4">
          <h2 class="text-center mb-5">Edit User</h2>
          <form th:action="@{/edit/{id}(id=${userDto.id})}" th:method="post" th:object="${userDto}">
            
            <div class="row mb-3">
    			<label class="col-sm-4 col-form-label">ID</label>
    				<div class="col-sm-8">
      					<input readonly class="form-control-plaintext" th:field="*{id}">
    				</div>
  			</div>
            
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">Name</label>
              <div class="col-sm-8">
                <input class="form-control" th:field="*{name}">
                <p th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></p>
              </div>
            </div>
            
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">Email</label>
              <div class="col-sm-8">
                <input class="form-control" th:field="*{email}">
                <p th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></p>
              </div>
            </div>
  
            <div class="row">
              <div class="offset-sm-4 col-sm-4 d-grid">
                <button type="submit" class="btn btn-primary">Submit</button>
              </div>
              <div class="col-sm-4 d-grid">
                <a class="btn btn-outline-primary" href="/" role="button">Cancel</a>
              </div>
            </div>
            
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
